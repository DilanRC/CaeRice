schema = 1

[defaults]
profile = "personal"

[[entry]]
source = "dotfiles/home/.config/cortetsu/ui.toml"
target = ".config/cortetsu/ui.toml"
tags = ["core", "theme"]

[[entry]]
source = "dotfiles/home/.config/cortetsu/performance.toml"
target = ".config/cortetsu/performance.toml"
tags = ["core", "performance"]

[[entry]]
source = "dotfiles/home/.config/cortetsu/scenes.toml"
target = ".config/cortetsu/scenes.toml"
tags = ["core", "scenes"]

[[entry]]
source = "config/hypr-user.lua"
target = ".config/caelestia/hypr-user.lua"
tags = ["shell-bridge"]

[[entry]]
source = "config/systemd/user/cortetsu-power-auto.service"
target = ".config/systemd/user/cortetsu-power-auto.service"
tags = ["services"]

[[entry]]
source = "config/systemd/user/cortetsu-shell.service"
target = ".config/systemd/user/cortetsu-shell.service"
tags = ["services"]
