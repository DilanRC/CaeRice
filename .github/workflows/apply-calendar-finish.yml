name: Apply Calendar and Pomodoro completion

on:
  push:
    branches:
      - feature/calendar-google-read-pomodoro
    paths:
      - scripts/.finish-calendar-pomodoro.py
      - .github/workflows/apply-calendar-finish.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message != 'feat(calendar): finish Google Calendar and Pomodoro runtime' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/calendar-google-read-pomodoro
          fetch-depth: 0
      - name: Apply verified payload
        run: python3 scripts/.finish-calendar-pomodoro.py
      - name: Validate generated sources
        run: |
          python3 -m py_compile \
            caelestia/bin/caerice-calendar \
            caelestia/bin/caerice-pomodoro \
            caelestia/bin/compose-panels.py \
            caelestia/tests/test-calendar-credentials.py \
            caelestia/tests/test-calendar-polish.py \
            caelestia/tests/test-pomodoro.py \
            caelestia/tests/test-runtime-contract.py
          bash -n caelestia/bin/build-runtime.sh
          bash -n caelestia/bin/caelestia
          bash -n caelestia/bin/rollback-runtime.sh
          bash -n scripts/install-caerice.sh
          python3 caelestia/tests/test-calendar-credentials.py
          bash caelestia/tests/test-calendar-readonly.sh
          python3 caelestia/tests/test-calendar-polish.py
          python3 caelestia/tests/test-pomodoro.py
          python3 caelestia/tests/test-runtime-contract.py
      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows/apply-calendar-finish.yml
          rm -f .github/workflows/calendar-pomodoro-ci.yml
          git add -A
          git commit -m "feat(calendar): finish Google Calendar and Pomodoro runtime"
          git push origin HEAD:feature/calendar-google-read-pomodoro
