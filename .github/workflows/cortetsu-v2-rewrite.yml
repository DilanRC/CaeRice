name: Cortetsu v2 one-shot rewrite

on:
  push:
    branches:
      - feature/cortetsu-v2-modernize
    paths:
      - scripts/maintenance/cortetsu-v2-rewrite.py
      - .github/workflows/cortetsu-v2-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/cortetsu-v2-modernize

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Rewrite active namespace
        run: python3 scripts/maintenance/cortetsu-v2-rewrite.py

      - name: Remove one-shot machinery
        run: |
          rm -f scripts/maintenance/cortetsu-v2-rewrite.py
          rm -f .github/workflows/cortetsu-v2-rewrite.yml
          rmdir scripts/maintenance 2>/dev/null || true

      - name: Validate mechanical rewrite
        run: |
          git diff --check
          test -f scripts/install-cortetsu.sh
          test -f config/systemd/user/cortetsu-power-auto.service
          test -f caelestia/bin/cortetsu-calendar
          ! git grep -n -I -E 'caerice-|CAERICE_|~/.config/caerice|~/.local/state/caerice' -- ':!docs/history/**' ':!docs/PROVENANCE.md'

      - name: Commit rewritten tree
        run: |
          git add -A
          git commit -m 'refactor(v2): make Cortetsu namespace canonical'
          git push origin HEAD:feature/cortetsu-v2-modernize
