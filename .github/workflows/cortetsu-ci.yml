name: Cortetsu static validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Validate repository whitespace
        run: git diff --check HEAD^ HEAD
      - name: Validate Cortetsu manifest
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib
          with pathlib.Path('cortetsu.toml').open('rb') as handle:
              data = tomllib.load(handle)
          assert data['project']['name'] == 'Cortetsu'
          assert data['project']['stage'] == 'v2-modern'
          assert data['identity']['canonical_command'] == 'cortetsu'
          assert data['upstream']['caelestia']['tag'] == 'v2.4.0'
          assert data['runtime']['current'].endswith('/quickshell/cortetsu/current')
          assert data['compatibility']['active_legacy'] is False
          print('manifest: valid')
          PY
      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do python3 -m py_compile "$file"; done < <(find scripts -type f -name '*.py' -print0)
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"
            if [[ "$first_line" == *python3* ]]; then python3 -m py_compile "$file"; fi
          done < <(find caelestia/bin -type f -print0)
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts caelestia/bin -type f -name '*.sh' -print0)
          bash -n scripts/cortetsu
          bash -n scripts/migrate-cortetsu-v2.sh
      - name: Validate modern contract
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/cortetsu
          test -x scripts/migrate-cortetsu-v2.sh
          test -f scripts/install-cortetsu.sh
          test -f docs/CORTETSU_ARCHITECTURE.md
          test -f docs/IDENTITY.md
          test -f docs/PROVENANCE.md
          grep -q '^# Cortetsu' README.md
          ! git grep -n -I -E 'caerice-|CAERICE_|~/.config/caerice|~/.local/state/caerice' -- ':!docs/history/**' ':!docs/PROVENANCE.md' ':!scripts/migrate-cortetsu-v2.sh' ':!.github/workflows/**'
          ! git grep -n -I 'sh -c' -- '*.qml'
          ! git grep -n -I 'CORTETSU_DATA_ROOT:-${CORTETSU_DATA_ROOT' -- ':!docs/history/**'
          ! git grep -n -I 'CORTETSU_RUNTIME_ROOT:-${CORTETSU_RUNTIME_ROOT' -- ':!docs/history/**'
