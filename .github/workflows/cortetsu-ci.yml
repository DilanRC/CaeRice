name: Cortetsu static validation

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.ref == 'refs/heads/feature/cortetsu-v2-modernize' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/cortetsu-v2-modernize
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply deterministic polish
        run: python3 scripts/maintenance/cortetsu-v2-polish.py
      - name: Remove one-shot polish script
        run: |
          rm -f scripts/maintenance/cortetsu-v2-polish.py
          rmdir scripts/maintenance 2>/dev/null || true
      - name: Gate rewritten tree
        run: |
          git diff --check
          test -x scripts/migrate-cortetsu-v2.sh
          test -f scripts/install-cortetsu.sh
          test -f caelestia/bin/cortetsu-calendar
          test -f caelestia/bin/cortetsu-pomodoro
          ! git grep -n -I -E 'caerice-|CAERICE_|~/.config/caerice|~/.local/state/caerice' -- ':!docs/history/**' ':!docs/PROVENANCE.md' ':!scripts/migrate-cortetsu-v2.sh'
          ! git grep -n -I 'CORTETSU_DATA_ROOT:-${CORTETSU_DATA_ROOT' -- ':!docs/history/**'
          ! git grep -n -I 'CORTETSU_RUNTIME_ROOT:-${CORTETSU_RUNTIME_ROOT' -- ':!docs/history/**'
      - name: Commit polished tree
        run: |
          git add -A ':!.github/workflows'
          git commit -m 'refactor(v2): purge active legacy and idle polling'
          git push origin HEAD:feature/cortetsu-v2-modernize

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Validate repository whitespace
        run: git diff --check HEAD^ HEAD
      - name: Validate Cortetsu manifest
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib
          with pathlib.Path('cortetsu.toml').open('rb') as handle:
              data = tomllib.load(handle)
          assert data['project']['name'] == 'Cortetsu'
          assert data['identity']['canonical_command'] == 'cortetsu'
          assert data['upstream']['caelestia']['tag'] == 'v2.4.0'
          assert data['runtime']['current'].endswith('/quickshell/cortetsu/current')
          print('manifest: valid')
          PY
      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do python3 -m py_compile "$file"; done < <(find scripts -type f -name '*.py' -print0)
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"
            if [[ "$first_line" == *python3* ]]; then python3 -m py_compile "$file"; fi
          done < <(find caelestia/bin -type f -print0)
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts caelestia/bin -type f -name '*.sh' -print0)
          bash -n scripts/cortetsu
      - name: Validate modern contract
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/cortetsu
          test -f scripts/install-cortetsu.sh
          test -f docs/CORTETSU_ARCHITECTURE.md
          test -f docs/IDENTITY.md
          test -f docs/PROVENANCE.md
          grep -q '^# Cortetsu' README.md
          ! git grep -n -I -E 'caerice-|CAERICE_|~/.config/caerice|~/.local/state/caerice' -- ':!docs/history/**' ':!docs/PROVENANCE.md' ':!scripts/migrate-cortetsu-v2.sh'
          ! git grep -n -I 'sh -c' -- '*.qml'
