name: Fish import contract

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compile importer
        run: python3 -m py_compile core/import_fish.py scripts/features/test-fish-import.py
      - name: Validate safe Fish import
        run: python3 scripts/features/test-fish-import.py
