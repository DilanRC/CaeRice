name: Desktop import contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile importer
        run: python3 -m py_compile core/import_desktop.py scripts/features/test-desktop-import.py
      - name: Validate safe desktop import
        run: python3 scripts/features/test-desktop-import.py
      - name: Validate helper syntax
        run: bash -n cortetsu/bin/cortetsu-import-desktop
